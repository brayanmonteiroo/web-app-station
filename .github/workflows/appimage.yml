# SPDX-License-Identifier: MIT

name: AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libkf6kirigami-dev libkf6i18n-dev libkf6coreaddons-dev \
            libkf6config-dev libkf6iconthemes-dev \
            qml6-module-org-kde-kirigami \
            kde-style-breeze-qt6 \
            libfuse2t64 zsync curl \
            || sudo apt-get install -y \
              cmake ninja-build g++ extra-cmake-modules \
              qt6-base-dev qt6-declarative-dev \
              libkf6kirigami2-dev libkf6i18n-dev libkf6coreaddons-dev \
              libkf6config-dev libkf6iconthemes-dev \
              libfuse2 zsync curl

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build.sh
          ./packaging/appimage/build.sh

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WebAppStation-*.AppImage
            WebAppStation-*.AppImage.zsync
          generate_release_notes: true

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: web-app-station-appimage
          path: |
            WebAppStation-*.AppImage
            WebAppStation-*.AppImage.zsync
          retention-days: 7
