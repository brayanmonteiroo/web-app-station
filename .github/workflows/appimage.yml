# SPDX-License-Identifier: MIT

name: AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 não tem KF6; build no Fedora (mesmo stack do README).
    container:
      image: fedora:42

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake ninja-build gcc-c++ extra-cmake-modules gettext \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kconfig-devel kf6-kiconthemes-devel kf6-qqc2-desktop-style \
            kf6-kirigami kf6-breeze-icons \
            zsync curl file which desktop-file-utils
          # Opcional: FUSE. O build.sh já usa --appimage-extract-and-run.
          dnf install -y fuse fuse-libs || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build.sh
          ./packaging/appimage/build.sh

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WebAppStation-*.AppImage
            WebAppStation-*.AppImage.zsync
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: web-app-station-appimage
          path: |
            WebAppStation-*.AppImage
            WebAppStation-*.AppImage.zsync
          retention-days: 7
