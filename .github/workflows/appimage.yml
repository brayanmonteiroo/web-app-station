# SPDX-License-Identifier: MIT

name: AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 não tem KF6; build no Fedora recente (Qt/KF alinhados ao desktop atual).
    container:
      image: fedora:44

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake ninja-build gcc-c++ extra-cmake-modules gettext \
            glibc-langpack-en \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtwayland \
            kf6-kirigami-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kconfig-devel kf6-kiconthemes-devel kf6-qqc2-desktop-style \
            kf6-kirigami kf6-breeze-icons \
            zsync curl file which desktop-file-utils patchelf
          command -v qmake6 || command -v qmake-qt6
          dnf install -y fuse fuse-libs || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          chmod +x packaging/appimage/build.sh
          ./packaging/appimage/build.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-station-appimage
          path: |
            WebAppStation-*.AppImage
            WebAppStation-*.AppImage.zsync
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WebAppStation-*.AppImage
            WebAppStation-*.AppImage.zsync
          generate_release_notes: true
          fail_on_unmatched_files: true

  smoke-nofk:
    name: Smoke sem KF no host
    needs: appimage
    runs-on: ubuntu-24.04
    # Distro mínima: sem kf6/kirigami/plasma. Só runtime genérico + fuse.
    container:
      image: fedora:44

    steps:
      - name: Install runtime mínimo (sem KF/Plasma)
        run: |
          set -euo pipefail
          # Nomes Fedora 44+: libwayland-client (não wayland-libs-client).
          # libglvnd-* para OpenGL/EGL sem puxar KF/Plasma.
          dnf install -y --setopt=install_weak_deps=False \
            glibc libstdc++ libgcc zlib-ng-compat zlib \
            libxcb libX11 libXext libXrender libXi libxkbcommon \
            mesa-libGL fontconfig freetype harfbuzz \
            libwayland-client libwayland-cursor libwayland-egl \
            libglvnd libglvnd-opengl libglvnd-egl \
            dbus-libs pcre2 glib2 libicu openssl-libs \
            which file curl fuse fuse-libs \
            glibc-langpack-en \
            --skip-unavailable
          # Falha se o host tiver KF/Kirigami/Plasma (prova de isolamento).
          if rpm -qa | grep -E '^(kf6-|kirigami|plasma-)'; then
            echo "Host do smoke não deve ter KF/Kirigami/Plasma" >&2
            rpm -qa | grep -E '^(kf6-|kirigami|plasma-)' >&2
            exit 1
          fi

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: web-app-station-appimage
          path: artifacts

      - name: Extract and smoke
        run: |
          set -euo pipefail
          APPIMAGE=$(ls -1 artifacts/WebAppStation-*-x86_64.AppImage | head -n1)
          test -f "$APPIMAGE"
          chmod +x "$APPIMAGE"
          # Em container o bind do artifact pode vir sem +x executável no mount.
          cp "$APPIMAGE" /tmp/webappstation.AppImage
          chmod +x /tmp/webappstation.AppImage

          mkdir -p /tmp/appimg-smoke
          cd /tmp/appimg-smoke
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/webappstation.AppImage --appimage-extract

          test -x squashfs-root/usr/bin/webappstation
          test -n "$(find squashfs-root/usr/lib -name 'libKF6I18n.so*' | head -n1)"
          test -n "$(find squashfs-root -path '*kirigami*' | head -n1)"
          test ! -d squashfs-root/usr/qml/org/kde/qqc2desktopstyle
          test -f squashfs-root/usr/share/icons/hicolor/scalable/apps/org.kde.webappstation.svg

          # Resolver só libs do AppDir (simula Arch limpo / Hyprland sem KF).
          export LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib"
          export QT_PLUGIN_PATH="$PWD/squashfs-root/usr/plugins"
          export QML_IMPORT_PATH="$PWD/squashfs-root/usr/qml:${PWD}/squashfs-root/usr/lib/qml"
          export QML2_IMPORT_PATH="$QML_IMPORT_PATH"
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_CONTROLS_STYLE=Fusion
          unset QT_STYLE_OVERRIDE || true

          ldd squashfs-root/usr/bin/webappstation | tee /tmp/ldd-smoke.txt
          if grep -E ' => not found' /tmp/ldd-smoke.txt; then
            echo "Dependências faltando no AppImage (não self-contained)" >&2
            exit 1
          fi
          # KF/Qt devem resolver de dentro do AppDir, não de /usr/lib64 do host.
          if grep -E 'libKF6|libQt6|libKirigami' /tmp/ldd-smoke.txt \
               | grep -v squashfs-root | grep -E ' => /usr/'; then
            echo "KF/Qt resolvendo do host — AppImage não está self-contained" >&2
            exit 1
          fi

          # Execução: em container headless pode segfault (GPU/session).
          # Falha só se faltar .so (127 / loading shared libraries).
          set +e
          timeout 20 squashfs-root/AppRun >/tmp/apprun-out.txt 2>&1
          rc=$?
          set -e
          cat /tmp/apprun-out.txt || true
          if grep -qi 'error while loading shared libraries' /tmp/apprun-out.txt; then
            echo "AppRun: biblioteca compartilhada ausente" >&2
            exit 1
          fi
          if [[ "$rc" -eq 127 ]]; then
            echo "AppRun exit 127 (comando/lib não encontrado)" >&2
            exit 1
          fi
          echo "Smoke OK (ldd + KF no AppDir; AppRun rc=$rc)"
