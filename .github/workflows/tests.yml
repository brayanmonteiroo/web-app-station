# SPDX-License-Identifier: MIT

name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ctest:
    name: CTest
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libkf6kirigami-dev libkf6i18n-dev libkf6coreaddons-dev \
            libkf6config-dev libkf6iconthemes-dev \
            qml6-module-org-kde-kirigami \
            kde-style-breeze-qt6 \
            || sudo apt-get install -y \
              cmake ninja-build g++ extra-cmake-modules \
              qt6-base-dev qt6-declarative-dev \
              libkf6kirigami2-dev libkf6i18n-dev libkf6coreaddons-dev \
              libkf6config-dev libkf6iconthemes-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
