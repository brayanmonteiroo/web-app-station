# SPDX-License-Identifier: MIT

name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ctest:
    name: CTest
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 não tem KF6 nos repos; Fedora alinha com o ambiente de desenvolvimento.
    container:
      image: fedora:44

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            git cmake ninja-build gcc-c++ extra-cmake-modules gettext \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kconfig-devel kf6-kiconthemes-devel kf6-qqc2-desktop-style \
            kf6-kirigami kf6-breeze-icons

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
